site_name: odesuite
site_description: >-
  A from-scratch ODE solver library: adaptive Runge-Kutta, stiff solvers,
  events, DAEs, BVPs and sensitivities.
copyright: "&copy; 2026 Ediz — MIT"

# No site_url / repo_url: this is built and served locally.
# Add them, plus a deploy workflow, if the project is ever published.

docs_dir: docs

# Staging the README and figures rather than keeping a second copy of them.
hooks:
  - scripts/docs_hooks.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.highlight
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # The library's docstrings are numpydoc style -- `Parameters` under
            # a row of dashes, as in driver.solve.
            docstring_style: numpy
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Overview: index.md
  - Examples: examples.md
  - When each method fails: limits.md
  - API reference:
      - Core: api/core.md
      - Methods: api/methods.md
      - Step control: api/controllers.md
      - Continuous output: api/dense.md
      - Beyond the IVP: api/beyond.md
  - Security: security.md
  - License: license.md

validation:
  # A link that does not resolve is a documentation bug; fail rather than ship it.
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
