name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The README claims the library is usable with no interface attached, and that
  # `odesuite` never imports Qt. That is an architectural promise, so it gets a
  # job of its own rather than being taken on trust: install the library extra
  # only, and fail if PySide6 turns up in sys.modules after importing it.
  library-only:
    name: library without Qt (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[plots]" pytest

      - name: odesuite imports without Qt
        run: |
          python -c "
          import sys, odesuite
          leaked = [m for m in sys.modules if m.startswith(('PySide', 'shiboken'))]
          assert not leaked, f'the library imported Qt: {leaked}'
          print('odesuite', odesuite.__version__, 'imported clean')
          "

      - name: the library's own tests, with the app tests skipping themselves
        run: pytest tests/ -q

  checks:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install ruff mypy numpy scipy
      - run: ruff check .
      - run: mypy

      # Nothing here would otherwise notice an advisory against a dependency.
      # `--strict` fails on a package whose version cannot be resolved, which is
      # what makes silence meaningful rather than merely quiet.
      - name: dependency advisories
        run: |
          pip install pip-audit
          pip-audit --strict --desc on .

  tests:
    name: full suite (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Cover what the package *claims*. `pyproject.toml` advertises Python
    # 3.10-3.13 and "Operating System :: OS Independent"; this job used to test
    # 3.10 and 3.12 on Linux and Windows, which left macOS and two Python
    # versions as promises with nothing behind them.
    #
    # Not the full 3 x 4 cross product -- twelve legs to buy very little. The
    # rule is: every advertised OS runs on at least one version, and every
    # advertised version runs on at least one OS. Eight legs, and the classifier
    # list is backed.
    #
    # If a leg here proves unsupportable, the honest fix is to narrow the
    # classifiers rather than to delete the leg.
    #
    # **Those eight legs run on demand, not on every push.** The repository is
    # private, so Actions minutes are metered: 2,000 a month on the free plan,
    # with Windows minutes counted twice and macOS minutes ten times. Measured
    # on the 2026-10-06 run, the eight legs took 27-106 min on Ubuntu, 149 and
    # 185 min on Windows and 22 and 47 min on macOS, about 1,600 billed minutes
    # for one push. Two pushes used the month up, and every later run showed
    # 0/13 because GitHub refused to start the jobs. A push or a pull request
    # now runs the one Ubuntu leg that also measures coverage. The whole matrix
    # runs from "Run workflow" on the Actions tab, before a release; and the
    # release workflow builds and self-tests the frozen app on Windows and
    # macOS for every tag in any case.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && '[{"os":"ubuntu-latest","python":"3.10"},{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.13"},{"os":"windows-latest","python":"3.10"},{"os":"windows-latest","python":"3.12"},{"os":"macos-latest","python":"3.10"},{"os":"macos-latest","python":"3.12"}]'
          || '[{"os":"ubuntu-latest","python":"3.12"}]') }}
    # A cap, so that one stuck leg cannot spend a month's minutes. Ubuntu's
    # slowest measured leg took 106 min and Windows' 185.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 240 || 150 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PySide6 needs these even under the offscreen platform; without them the
      # import fails rather than the tests skipping, which would hide a break.
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 \
            libfontconfig1 libfreetype6

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      # `tests/conftest.py` forces the offscreen platform, but setting it here
      # too means a stray direct invocation cannot open a window on a runner.
      #
      # `-n auto` was previously unusable: two equation-editor tests depend on
      # the `dsolve` subprocess beating a wall-clock deadline, which an
      # oversubscribed machine breaks. The deadline is now raised for the test
      # session (see tests/conftest.py), and the suite has been run parallel
      # three times over without a failure.
      # Coverage is measured on one leg rather than all eight: the figure does
      # not depend on the platform, and gathering it eight times over would slow
      # every run to buy the same number.
      #
      # Two thresholds, because one average hides the thing worth protecting.
      # The library is the product and sits at 96%; the interface is harder to
      # exercise and sits at 90%, and a single combined gate would let the
      # library slide while the total stayed green.
      #
      # --timeout: a test that runs ten minutes is stuck, not slow. Without it
      # a hang showed only as a leg frozen at 98% until the job's own timeout,
      # with no stack to read; pytest-timeout fails the test and dumps every
      # thread instead.
      - name: pytest
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.12'
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q -n auto --timeout=600

      - name: pytest with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -q -n auto --timeout=600 \
            --cov=odesuite --cov=odesuite_app \
            --cov-report=term-missing:skip-covered \
            --cov-report=html:htmlcov \
            --cov-fail-under=88
          coverage report --include='*/odesuite/*' --omit='*/odesuite_app/*' \
            --fail-under=95

      - name: upload the coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: htmlcov
          if-no-files-found: ignore

      - name: selftest across every method family
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m odesuite_app --selftest selftest-report.txt

      - name: upload the selftest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.os }}-${{ matrix.python }}
          path: selftest-report.txt
          if-no-files-found: ignore

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      # The claim this project makes is that the library is usable with no
      # interface attached. The only test of that is installing the built wheel
      # somewhere that has never seen the source tree.
      - name: install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python - <<'PY'
          import sys, numpy as np
          import odesuite
          from odesuite import ODEProblem, solve

          leaked = [m for m in sys.modules
                    if m.startswith(('PySide', 'shiboken', 'pyqtgraph', 'matplotlib'))]
          assert not leaked, f"the wheel pulled in {leaked}"

          problem = ODEProblem(lambda t, y: np.array([y[1], -y[0]]), (0.0, 10.0), [1.0, 0.0])
          sol = solve(problem, "dopri5", rtol=1e-10, atol=1e-12, dense_output=True)
          error = abs(sol.y_at(10.0)[0] - np.cos(10.0))
          assert sol.success and error < 1e-9, error
          print(f"odesuite {odesuite.__version__}: clean install solves to {error:.2e}")
          PY

      - name: the console script explains itself without the app extra
        run: |
          set +e
          output=$(/tmp/clean/bin/odesuite-gui 2>&1); status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          echo "$output" | grep -q "odesuite\[app\]"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[docs]"
      # --strict turns a broken cross-reference into a failure. A docs site that
      # builds with warnings is a docs site with dead links in it.
      - run: mkdocs build --strict
