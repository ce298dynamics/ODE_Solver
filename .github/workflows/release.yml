name: release

# Pushing a tag like v0.5.0 builds the studio for Windows and macOS, checks each
# frozen build (packaging/build.py refuses to zip one that fails), and attaches
# the zips to a GitHub Release of the same name. Those zips are what a student
# downloads: no Python, no pip.
#
# The macOS build is not code-signed, so the first launch needs right-click ->
# Open. The Windows build is unsigned too, and SmartScreen says so once.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[app]" pyinstaller
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.os }}
          path: dist/odesuite-studio-*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" zips/*.zip \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
