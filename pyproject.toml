[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odesuite"
# Single source of truth: `odesuite.__version__`. Declaring it here as well is
# how the three copies of "0.1.0" that used to exist drifted apart.
dynamic = ["version"]
description = "A from-scratch ODE solver library: adaptive Runge-Kutta, stiff solvers, events, DAEs, BVPs and sensitivities."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ediz" }]
keywords = [
    "ode", "differential-equations", "runge-kutta", "stiff", "dae", "bvp",
    "numerical-analysis", "scientific-computing", "initial-value-problem",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
# Upper bounds on the two that this project is *behaviourally* coupled to, not
# merely API-coupled. `odesuite_app.steps` dispatches on sympy's `classify_ode`
# hint strings -- internal identifiers with no stability promise -- so a sympy
# major release could change which technique a student is shown a derivation
# for, and no test of an API signature would notice. PySide6 is capped for the
# ordinary reason that Qt majors break widgets.
#
# numpy and scipy are left open deliberately: the library uses their stable
# surface, numpy 2 was adopted without incident, and pinning them would make
# `odesuite` awkward to install alongside anything else.
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
app = ["PySide6>=6.6,<7", "pyqtgraph>=0.13", "matplotlib>=3.7", "sympy>=1.12,<2"]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.0",
    # For the test that checks the CI matrix backs the package classifiers.
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "PySide6>=6.6,<7",
    "pyqtgraph>=0.13",
    "sympy>=1.12,<2",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.0",
    # tests/test_properties.py (TEST-03).
    "hypothesis>=6.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    # 12.x changed `Highlight.__init__` to require `md`, which mkdocstrings
    # 1.0.6 does not pass, so every API page fails to build. Lift this once
    # mkdocstrings catches up.
    "pymdown-extensions<12",
]

[project.scripts]
odesuite-gui = "odesuite_app.cli:main"

[tool.setuptools.dynamic]
version = { attr = "odesuite.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: without this marker the library's annotations are invisible to a
# downstream type checker, however complete they are.
odesuite = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes more than a couple of seconds; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Deliberately conservative. These are the families that find real defects --
# dead imports, unused variables, undefined names, import hygiene. The stylistic
# families (B, C4, SIM) flag another ~50 sites, none of them bugs; turning them
# on would mean rewriting working numerical code to satisfy a tool that was
# added after it. They can be adopted one at a time, on purpose, later.
select = ["E", "F", "W", "I", "UP"]
ignore = [
    # The numerical code names variables after the mathematics it implements --
    # A, J, T, E, K, Z are the symbols in Hairer & Wanner, and renaming them to
    # satisfy a linter would make the code harder to check against the source.
    "E741",
    # Assigning a lambda is the clearest form for the small closures the tests
    # use to stand in for an interpolant.
    "E731",
    # "%.2e" % x inside an f-string is the idiom used throughout for formatting
    # lists of numbers in assertion messages, and reads better than the nested
    # f-string alternative.
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
# Re-exports: the package's public surface is deliberately assembled here.
"src/odesuite/__init__.py" = ["F401"]
"src/odesuite/steppers/__init__.py" = ["F401"]
"src/odesuite/bvp/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
files = ["src/odesuite"]
ignore_missing_imports = true
# The library is annotated but not exhaustively; these are the checks that catch
# real mistakes without demanding that every numpy expression be typed.
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
